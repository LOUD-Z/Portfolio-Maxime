<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Page avec 3 zones horizontales et version mobile</title>
  <style>
    html, body {
      height: 100%;
      margin: 0;
    }
    body {
      display: flex;
      flex-direction: column;
      height: 100vh;
      font-family: Arial, sans-serif;
    }
    .zone {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      color: white;
      background-size: cover;
      background-position: center;
      transition: filter .2s ease;
      text-align: center;
      padding: 20px;
    }
    .zone:hover {
      filter: brightness(1.1);
    }
    .overlay {
      background: rgba(0, 0, 0, 0.45);
      padding: 20px 30px;
      border-radius: 8px;
      font-size: clamp(1.2rem, 2vw, 2.5rem);
      line-height: 1.3;
      max-width: 90%;
    }

    /* Version mobile : zones empilées avec défilement */
    @media (max-width: 768px) {
      body {
        flex-direction: column;
        height: auto;
      }
      .zone {
        flex: none;
        height: 250px;
      }
    }
  </style>
</head>
<body>
  <!-- Zone 1 -->
  <a href="gallery mode/portfolio.html" class="zone" style="background-image: url('images/fond1.jpg');">
    <div class="overlay">Texte de la Zone 1</div>
  </a>

  <!-- Zone 2 -->
  <a href="/page2.html" class="zone" style="background-image: url('images/fond2.jpg');">
    <div class="overlay">Texte de la Zone 2</div>
  </a>

  <!-- Zone 3 -->
  <a href="template gallery shooting/index.html" class="zone" style="background-image: url('images/fond3.jpg');">
    <div class="overlay">Texte de la Zone 3</div>
  </a>
</body>
</html>
